Vals);ar.min=Math.floor(aMin);ar.max=Math.ceil(aMax);if(ar.max<=ar.min)ar.max=ar.min+1;}else{ar.min=30;ar.max=220;}ar.lo=ar.min;ar.hi=ar.max;ar.step=aStep;var fl=state.ranges.floor;var fStep=CFG.floorStep||1;if(floorVals.length){var fMin=Math.min.apply(null,floorVals);var fMax=Math.max.apply(null,floorVals);fl.min=Math.floor(fMin);fl.max=Math.ceil(fMax);if(fl.max<=fl.min)fl.max=fl.min+1;}else{fl.min=1;fl.max=5;}fl.lo=fl.min;fl.hi=fl.max;fl.step=fStep;}function syncRangeUI(key){var wrap=root.querySelector('.kv-range[data-range="'+key+'"]');if(!wrap)return;var r=state.ranges[key];var minInp=wrap.querySelector('[data-bound="min"]');var maxInp=wrap.querySelector('[data-bound="max"]');var track=wrap.querySelector('[data-slider]');var fill=wrap.querySelector('.kv-range__fill');var tMin=wrap.querySelector('[data-thumb="min"]');var tMax=wrap.querySelector('[data-thumb="max"]');if(!minInp||!maxInp||!track||!fill||!tMin||!tMax)return;if(key==='area'){minInp.value=fmtArea(r.lo);maxInp.value=fmtArea(r.hi);}else{minInp.value=fmtInt(r.lo);maxInp.value=fmtInt(r.hi);}var span=r.max-r.min||1;var pLo=Math.max(0,Math.min(1,(r.lo-r.min)/span));var pHi=Math.max(pLo,Math.min(1,(r.hi-r.min)/span));var ab=root.getAttribute('data-ab');var thumbW=(ab==='390'||ab==='640')?14:12;var pad=thumbW===14?12:15;var trackW=track.clientWidth||track.offsetWidth||0;var travel=Math.max(1,trackW-pad*2-thumbW);var minX=pad+travel*pLo;var maxX=pad+travel*pHi;tMin.style.left=minX+'px';tMin.style.right='auto';tMax.style.left=maxX+'px';tMax.style.right='auto';tMin.style.transform='';tMax.style.transform='';var lineInset=pad+thumbW/2;var fillLeft=lineInset+Math.max(0,trackW-lineInset*2)*pLo;var fillWidth=Math.max(0,trackW-lineInset*2)*(pHi-pLo);fill.style.left=fillLeft+'px';fill.style.width=fillWidth+'px';wrap.classList.toggle('is-active',r.lo>r.min+0.0001||r.hi<r.max-0.0001);}var vpMeta=document.querySelector('meta[name="viewport"]');var vpOrig=vpMeta?vpMeta.getAttribute('content'):'';function lockVpZoom(on){if(!vpMeta)return;if(on){vpMeta.setAttribute('content','width=device-width,initial-scale=1,maximum-scale=1');}else if(vpOrig){vpMeta.setAttribute('content',vpOrig);}}function bindRanges(){qsa('.kv-range').forEach(function(wrap){var key=wrap.getAttribute('data-range');syncRangeUI(key);qsa('[data-bound]',wrap).forEach(function(inp){inp.addEventListener('focus',function(){lockVpZoom(true);});inp.addEventListener('blur',function(){lockVpZoom(false);});inp.addEventListener('change',function(){var r=state.ranges[key];var v=num(inp.value);if(!isFinite(v)){syncRangeUI(key);return;}v=Math.min(r.max,Math.max(r.min,v));if(inp.getAttribute('data-bound')==='min')r.lo=Math.min(v,r.hi);else r.hi=Math.max(v,r.lo);if(key==='area'||key==='floor'){r.lo=Math.round(r.lo);r.hi=Math.round(r.hi);}syncRangeUI(key);applyFilters();});inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();inp.blur();}});});var track=wrap.querySelector('[data-slider]');var dragging=null;function posToValue(clientX){var r=state.ranges[key];var rect=track.getBoundingClientRect();var ab=root.getAttribute('data-ab');var thumbW=(ab==='390'||ab==='640')?14:12;var pad=thumbW===14?12:15;var usable=Math.max(1,rect.width-pad*2-thumbW);var x=Math.min(usable,Math.max(0,clientX-rect.left-pad));var ratio=x / usable;var raw=r.min+ratio*(r.max-r.min);var stepped=Math.round(raw / r.step)*r.step;return Math.min(r.max,Math.max(r.min,stepped));}function onMove(e){if(!dragging)return;var clientX=e.touches?e.touches[0].clientX:e.clientX;var r=state.ranges[key];var v=posToValue(clientX);if(dragging==='min')r.lo=Math.min(v,r.hi);else r.hi=Math.max(v,r.lo);syncRangeUI(key);}function onUp(){if(!dragging)return;dragging=null;document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);applyFilters();}function startDrag(which,e){e.preventDefault();dragging=which;document.addEventListener(
