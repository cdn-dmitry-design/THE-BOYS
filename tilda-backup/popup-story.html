<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С чего всё началось</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arsenal&family=Cormorant:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<!--
  Триггер: класс .story-1 (также .story-2 / .story-3 позже)
  или data-tb-pop="story" data-tb-story="1"
  Фото на Тильде. Не используйте #story-1 — якорь кидает страницу вверх.
-->
<div id="tbStoryDemo">
  <a href="javascript:void(0)" class="story-1">С чего всё началось</a>
</div>
<div id="tbStoryMount" hidden></div>
<style>
#tbStoryDemo{min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;background:#f7f4ef;font-family:Arsenal,Arial,sans-serif}
#tbStoryDemo a{margin:0;padding:14px 22px;border:0;border-radius:999px;background:#04100c;color:#fdf7ee;font:inherit;font-size:16px;letter-spacing:-.28px;text-decoration:none}
#tbStoryDemo[hidden]{display:none!important}
[id^=rec]:has(#tbStoryMount){padding:0!important;margin:0!important;min-height:0!important;height:0!important;overflow:hidden!important;border:0!important;background:none!important}
[id^=rec]:has(#tbStoryMount) .t-container,[id^=rec]:has(#tbStoryMount) .t123,[id^=rec]:has(#tbStoryMount) .t123__content,[id^=rec]:has(#tbStoryMount) .t-col,[id^=rec]:has(#tbStoryMount) .t-width{max-width:none!important;width:100%!important;padding:0!important;margin:0!important;min-height:0!important;height:0!important;overflow:hidden!important}
html.tb-story-lock,html.tb-story-lock body{overflow:hidden!important;overscroll-behavior:none!important}
html.tb-story-lock body{position:fixed!important;left:0!important;right:0!important;width:100%!important}
.tb-story{position:fixed;inset:0;z-index:100000;background:transparent;overflow:hidden;overscroll-behavior:none;pointer-events:none;opacity:0;transition:opacity .4s cubic-bezier(.22,1,.36,1)}
.tb-story.is-on{pointer-events:auto;opacity:1}
.tb-story::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.tb-story.is-on::before{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tb-story.is-out::before{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.tb-story::after{content:"";position:absolute;inset:0;z-index:0;background:rgba(4,16,12,.6);pointer-events:none;opacity:0;transition:opacity .4s cubic-bezier(.22,1,.36,1)}
.tb-story.is-on::after{opacity:1}
.tb-story[hidden]{display:none!important}
.tb-story__stage{position:absolute;left:0;top:0;z-index:1;transform-origin:top left;box-sizing:border-box;pointer-events:auto}
.tb-story__stage *,.tb-story__stage :before,.tb-story__stage :after{box-sizing:border-box}
.tb-story__card{display:flex;flex-direction:column;width:608px;height:calc(100% - 46px);margin:46px auto 0;background:#fdf7ee;color:#04100c;-webkit-font-smoothing:antialiased;overflow:hidden;transform:translate3d(0,18px,0);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.tb-story.is-on .tb-story__card{transform:translate3d(0,0,0)}
.tb-story__bar{display:flex;align-items:center;justify-content:space-between;flex:0 0 48px;height:48px;padding:16px;background:#fdf7ee;position:relative;z-index:2}
.tb-story__nav,.tb-story__x{display:flex;align-items:center;margin:0;padding:0;border:0;background:0 0;color:#04100c;font:400 14px/1 Arsenal,Arial,sans-serif;letter-spacing:-.28px;text-transform:uppercase;cursor:pointer}
.tb-story__nav{gap:8px}
.tb-story__x{gap:4px;opacity:.4}
.tb-story__x:hover,.tb-story__x:focus-visible,.tb-story__nav:hover,.tb-story__nav:focus-visible{opacity:.7}
.tb-story__nav.is-dim{opacity:.2;cursor:default}
.tb-story__nav.is-dim:hover,.tb-story__nav.is-dim:focus-visible{opacity:.2}
.tb-story__nav svg,.tb-story__x svg{display:block;flex:0 0 auto}
.tb-story__arr.is-back{transform:scaleX(-1)}
.tb-story__x svg{transform:rotate(45deg)}
.tb-story__scroll{flex:1 1 0;min-height:0;overflow-x:hidden;overflow-y:auto;padding:16px;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tb-story__scroll::-webkit-scrollbar{display:none}
.tb-story__kicker{width:280px;margin:0 auto;font:400 14px/1.2 Arsenal,Arial,sans-serif;letter-spacing:-.28px;text-align:center;opacity:.4}
.tb-story__title{margin:8px 0 0;font:400 40px/.75 Cormorant,"Times New Roman",serif;letter-spacing:-.8px;text-align:center}
.tb-story__cols{display:flex;align-items:flex-start;gap:56px;width:100%;margin-top:40px}
.tb-story__col{width:240px;flex:0 0 240px;margin:0;font:400 14px/1.2 Arsenal,Arial,sans-serif;letter-spacing:-.28px;text-indent:58px;opacity:.6}
.tb-story__pic{display:block;width:100%;height:auto;aspect-ratio:280/432;margin:40px 0 0;object-fit:cover}
.tb-story__stage[data-ab="960"] .tb-story__title,.tb-story__stage[data-ab="640"] .tb-story__title,.tb-story__stage[data-ab="390"] .tb-story__title{font-size:32px;letter-spacing:-.64px}
.tb-story__stage[data-ab="390"] .tb-story__card{width:358px}
.tb-story__stage[data-ab="390"] .tb-story__cols{flex-direction:column;gap:24px}
.tb-story__stage[data-ab="390"] .tb-story__col{width:100%;flex:1 1 auto}
@media (prefers-reduced-motion:reduce){.tb-story,.tb-story::before,.tb-story::after,.tb-story__card{transition:none}}
</style>
<script>
(function(){
if(window.__tbStory)return;
window.__tbStory=1;
var PHOTO='https://static.tildacdn.com/tild6435-6634-4266-b836-373062653064/story-1.png';
var STORIES=[
  {
    id:'1',
    hash:'story-1',
    cls:'story-1',
    photo:PHOTO,
    chapter:'Глава 1',
    title:'С чего<br>всё началось',
    left:'Всё начинается не с одежды. Вы приезжаете к нам по записи. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече. Всё начинается не с одежды. Вы приезжаете к нам по записи. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече. Вы приезжаете&nbsp;&nbsp;&nbsp;&nbsp;к нам по записи. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече.',
    right:'Всё начинается не с одежды. Вы приезжаете к нам по записи. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече. Всё начинается не с одежды. Вы приезжаете к нам по записи. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече. Вы приезжаете&nbsp;&nbsp;&nbsp;&nbsp;к нам по записи. Мы уже знаем, с чем вы пришли, и заранее готовимся к встрече.'
  }
];
var ARR='<svg class="tb-story__arr" width="16" height="6" viewBox="0 0 16 6" aria-hidden="true"><path d="M12.669 5.71357L14.6827 3.21106L7.08063 3.43719L0 3.43719V2.56281L7.08063 2.56281L14.6827 2.78895L12.669 0.286432L12.987 0L16 3L12.987 6L12.669 5.71357Z" fill="#04100C"/></svg>';
var ARRBACK=ARR.replace('tb-story__arr','tb-story__arr is-back');
var XICO='<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 0V8" stroke="#04100C"/><path d="M8 4H0" stroke="#04100C"/></svg>';
var CLASS_SEL='.story-1, .story-2, .story-3';
var root,stage,iCur=0,hideT=0,unlockT=0,built=0,rsT=0,bound=0,scrollY=0,bodyTop='',recOverflow=null;
function ab(w){return w>=1200?1200:w>=960?960:w>=640?640:390;}
function storyById(id){
  id=normId(id);
  if(!id)return -1;
  for(var n=0;n<STORIES.length;n++)if(STORIES[n].id===id)return n;
  return -1;
}
function normId(id){
  if(id==null||id==='')return '';
  var s=String(id).toLowerCase();
  var m=s.match(/^story-(\d+)$/);
  return m?m[1]:s;
}
function idFromHash(h){
  h=String(h||'').toLowerCase();
  for(var n=0;n<STORIES.length;n++)if(STORIES[n].hash===h)return STORIES[n].id;
  return '';
}
function idFromClass(node){
  if(!node)return '';
  if(node.nodeType===3)node=node.parentElement;
  if(!node||!node.closest)return '';
  var el=node.closest(CLASS_SEL);
  if(!el||!el.classList)return '';
  for(var n=0;n<STORIES.length;n++){
    var c=STORIES[n].cls||STORIES[n].hash;
    if(c&&el.classList.contains(c))return STORIES[n].id;
  }
  if(el.classList.contains('story-1'))return '1';
  if(el.classList.contains('story-2'))return '2';
  if(el.classList.contains('story-3'))return '3';
  return '';
}
function frame(){return stage&&stage.querySelector('.tb-story__scroll');}
function scale(){
  if(!stage)return;
  var w=document.documentElement.clientWidth||innerWidth||320;if(w<320)w=320;
  var h=innerHeight||document.documentElement.clientHeight||700;
  var a=ab(w),sc=w/a,bottom=a===390?62:0;
  stage.setAttribute('data-ab',String(a));
  stage.style.width=a+'px';
  stage.style.height=(h/sc)+'px';
  stage.style.transformOrigin='top left';
  stage.style.zoom=sc;
  var card=stage.querySelector('.tb-story__card');
  if(card)card.style.height=Math.max(0,(h/sc)-46-bottom)+'px';
}
function render(){
  var s=STORIES[iCur]||STORIES[0];
  var prevOff=iCur<=0,nextOff=iCur>=STORIES.length-1;
  var h='<div class="tb-story__card" role="dialog" aria-modal="true" aria-labelledby="tbStoryTitle">';
  h+='<div class="tb-story__bar">';
  h+='<button type="button" class="tb-story__nav'+(prevOff?' is-dim':'')+'" data-nav="prev"'+(prevOff?' aria-disabled="true" tabindex="-1"':'')+'>'+ARRBACK+'<span>пред</span></button>';
  h+='<button type="button" class="tb-story__x" data-close><span>закрыть</span>'+XICO+'</button>';
  h+='<button type="button" class="tb-story__nav'+(nextOff?' is-dim':'')+'" data-nav="next"'+(nextOff?' aria-disabled="true" tabindex="-1"':'')+'>'+'<span>след</span>'+ARR+'</button>';
  h+='</div><div class="tb-story__scroll">';
  h+='<p class="tb-story__kicker">'+s.chapter+'</p>';
  h+='<h2 class="tb-story__title" id="tbStoryTitle">'+s.title+'</h2>';
  h+='<div class="tb-story__cols"><p class="tb-story__col">'+s.left+'</p><p class="tb-story__col">'+s.right+'</p></div>';
  h+='<img class="tb-story__pic" src="'+s.photo+'" alt="'+s.chapter+'" decoding="async">';
  h+='</div></div>';
  stage.innerHTML=h;
}
function go(dir){
  var n=iCur+dir;
  if(n<0||n>=STORIES.length)return;
  iCur=n;render();scale();
  var sc=frame();
  if(sc)sc.scrollTop=0;
}
function noMotion(){return matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}
function onKey(e){
  if(!root||root.hidden||!root.classList.contains('is-on'))return;
  if(e.key==='Escape'){close();return;}
  var sc=frame();
  if(!sc)return;
  var dy=0;
  if(e.key==='ArrowDown')dy=64;
  else if(e.key==='ArrowUp')dy=-64;
  else if(e.key==='PageDown'||e.key===' ')dy=sc.clientHeight*0.85*(e.shiftKey&&e.key===' '?-1:1);
  else if(e.key==='PageUp')dy=-sc.clientHeight*0.85;
  else if(e.key==='Home'){sc.scrollTop=0;e.preventDefault();return;}
  else if(e.key==='End'){sc.scrollTop=sc.scrollHeight;e.preventDefault();return;}
  if(!dy)return;
  sc.scrollTop+=dy;
  e.preventDefault();
}
function bind(on){
  if(!!on===!!bound)return;
  bound=on?1:0;
  var m=on?'addEventListener':'removeEventListener';
  document[m]('keydown',onKey);
}
function lock(on){
  var html=document.documentElement,rec=document.getElementById('allrecords');
  if(on){
    if(html.classList.contains('tb-story-lock'))return;
    scrollY=pageYOffset||html.scrollTop||0;
    if(scrollY<0)scrollY=0;
    bodyTop=document.body.style.top;
    document.body.style.top=-scrollY+'px';
    if(rec){recOverflow=rec.style.overflow;rec.style.overflow='hidden';}
    html.classList.add('tb-story-lock');
    bind(1);
    return;
  }
  if(!html.classList.contains('tb-story-lock'))return;
  html.classList.remove('tb-story-lock');
  document.body.style.top=bodyTop||'';
  if(rec&&recOverflow!=null){rec.style.overflow=recOverflow;recOverflow=null;}
  scrollTo(0,scrollY);
  bind(0);
}
function finish(){
  if(!root||root.classList.contains('is-on'))return;
  root.hidden=1;
  root.classList.remove('is-out');
  var sc=frame();
  if(sc)sc.scrollTop=0;
  lock(0);
}
function open(id){
  ensure();if(!root)return;
  if(id!=null&&id!==''){
    var n=storyById(id);
    if(n<0)return;
    iCur=n;
  }
  if(!root.hidden&&root.classList.contains('is-on')){render();scale();var sc0=frame();if(sc0)sc0.scrollTop=0;return;}
  render();
  clearTimeout(hideT);
  clearTimeout(unlockT);
  root.classList.remove('is-out');
  root.hidden=0;
  scale();
  lock(1);
  var sc=frame();if(sc)sc.scrollTop=0;
  if(noMotion())root.classList.add('is-on');
  else{root.classList.remove('is-on');void root.offsetWidth;requestAnimationFrame(function(){root.classList.add('is-on');});}
}
function close(){
  if(!root||root.hidden)return;
  root.classList.remove('is-on');
  root.classList.add('is-out');
  clearTimeout(hideT);
  clearTimeout(unlockT);
  if(noMotion()){finish();return;}
  unlockT=setTimeout(function(){lock(0);},80);
  hideT=setTimeout(finish,420);
}
function onStage(e){
  if(e.target.closest('[data-close]')){close();return;}
  if(e.target.closest('.tb-story__card')){
    var nav=e.target.closest('[data-nav]');
    if(!nav||nav.classList.contains('is-dim'))return;
    go(nav.getAttribute('data-nav')==='next'?1:-1);
    return;
  }
  close();
}
function popHash(e){
  var n=e.target;
  if(n&&n.nodeType===3)n=n.parentElement;
  if(!n||!n.closest)return '';
  var a=n.closest('a[href]');
  if(!a)return '';
  var h='';
  try{h=a.hash||'';}catch(err){}
  if(!h){var raw=a.getAttribute('href')||'',i=raw.indexOf('#');if(i>=0)h=raw.slice(i);}
  return String(h||'').replace(/^#/,'').split(/[?&\/]/)[0].toLowerCase();
}
function onDoc(e){
  var n=e.target;
  if(n&&n.nodeType===3)n=n.parentElement;
  var id=idFromClass(n);
  if(!id){
    var p=n&&n.closest&&n.closest('[data-tb-pop=story]');
    id=p?(p.getAttribute('data-tb-story')||'1'):idFromHash(popHash(e));
  }
  if(!id||storyById(id)<0)return;
  e.preventDefault();
  if(e.stopPropagation)e.stopPropagation();
  if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  open(id);
}
function ensure(){
  if(built)return;
  built=1;
  root=document.getElementById('tbStoryPop');
  if(!root){
    root=document.createElement('div');
    root.id='tbStoryPop';
    root.className='tb-story uc-no-scale';
    root.hidden=1;
    stage=document.createElement('div');
    stage.className='tb-story__stage';
    root.appendChild(stage);
    document.documentElement.appendChild(root);
  }else{
    stage=root.querySelector('.tb-story__stage');
    root.classList.add('uc-no-scale');
  }
  render();
  stage.addEventListener('click',onStage);
  addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(root&&!root.hidden)scale();},120);});
}
function boot(){
  document.addEventListener('click',onDoc,true);
  window.tbStoryPop={open:open,close:close,toggle:function(){root&&!root.hidden&&root.classList.contains('is-on')?close():open('1');}};
  var demo=document.getElementById('tbStoryDemo');
  if(document.getElementById('allrecords')){if(demo)demo.hidden=1;}
  else{ensure();open('1');}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
</html>
