  THE BOYS — вставьте ВЕСЬ этот блок в T123 (HTML-код).
  Важно: не одну строку <script src=...>, а именно этот inline-загрузчик —
  Тильда часто не запускает внешний src из HTML-блока.

  Zero Block → CSS-класс БЕЗ точки: order / visit / gift / story-1
  Несколько: order, arrow-bottom, arrow-an

<script>
(function () {
  if (window.__tbPopBoot) return;
  window.__tbPopBoot = 1;
  function add(src) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    (document.head || document.documentElement).appendChild(s);
    return s;
  }
  var primary = add('https://cdn.jsdelivr.net/gh/cdn-dmitry-design/THE-BOYS@main/cdn/popups.js?v=11');
  primary.onerror = function () {
    add('https://raw.githack.com/cdn-dmitry-design/THE-BOYS/main/cdn/popups.js?v=11');
  };
})();
</script>
